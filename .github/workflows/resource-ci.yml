name: Reconstructed Spore resource baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Prevent superseded commits from consuming duplicate hosted-runner minutes.
concurrency:
  group: resource-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resource:
    name: Resource baseline - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install X11 development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev xvfb xauth
      - name: Configure portable sources
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build resource library and tools
        run: cmake --build build --config Release --target dbpf_tool spore_prop_audit spore_terraform_probe terraform_math_tests spore_terrain_field terraform_field_tests spore_terrain_mesh_cli terrain_mesh_tests spore_terrain_view software_view_tests spore_terrain_live spore_creature_probe creature_runtime_tests creature_dynamics_tests creature_view_tests resource_tests package_stack_tests property_list_tests property_resolver_tests property_database_tests property_fuzz_tests --parallel 4
      - name: Run resource regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Upload package inspection tool
        uses: actions/upload-artifact@v4
        with:
          name: spore-decomp-dbpf-tool-${{ runner.os }}
          path: |
            build/dbpf_tool
            build/Release/dbpf_tool.exe
            build/dbpf_tool.exe
            build/spore_prop_audit
            build/Release/spore_prop_audit.exe
            build/spore_prop_audit.exe
            build/spore_terraform_probe
            build/Release/spore_terraform_probe.exe
            build/spore_terraform_probe.exe
            build/spore_terrain_field
            build/Release/spore_terrain_field.exe
            build/spore_terrain_field.exe
            build/spore_terrain_mesh
            build/Release/spore_terrain_mesh.exe
            build/spore_terrain_mesh.exe
            build/spore_terrain_view
            build/Release/spore_terrain_view.exe
            build/spore_terrain_view.exe
            build/spore_terrain_live
            build/Release/spore_terrain_live.exe
            build/spore_terrain_live.exe
            build/spore_creature_probe
            build/Release/spore_creature_probe.exe
            build/spore_creature_probe.exe
          if-no-files-found: error
          retention-days: 14

  source-inventory:
    name: Reconstructed source audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recovery audit against synthetic manifests
        run: python -m unittest discover -s tools/tests -p 'test_recovery_audit.py' -v
      - name: Inventory all migrated game modules without any retail assets
        run: python tools/recovery_audit.py --check --json artifacts/source-inventory.json --markdown artifacts/source-inventory.md
      - name: Publish migration and decompilation inventories
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-source-audit
          path: artifacts/
          retention-days: 30

  sanitizers:
    name: Property parser and resource safety (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure sanitizers
        run: >
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build resource and property tests with sanitizers
        run: >
          cmake --build build-sanitized --parallel 4
          --target resource_tests package_stack_tests property_list_tests
          property_resolver_tests property_database_tests property_fuzz_tests spore_prop_audit terraform_math_tests spore_terraform_probe terraform_field_tests spore_terrain_field terrain_mesh_tests spore_terrain_mesh_cli software_view_tests spore_terrain_view creature_runtime_tests creature_dynamics_tests spore_creature_probe creature_view_tests
      - name: Execute sanitized property regression suite
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure
