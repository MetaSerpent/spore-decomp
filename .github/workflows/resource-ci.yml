name: Reconstructed Spore resource baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  resource:
    name: Resource baseline - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable sources
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build resource library and tools
        run: cmake --build build --config Release --target dbpf_tool resource_tests package_stack_tests --parallel 4
      - name: Run resource regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Upload package inspection tool
        uses: actions/upload-artifact@v4
        with:
          name: spore-decomp-dbpf-tool-${{ runner.os }}
          path: |
            build/dbpf_tool
            build/Release/dbpf_tool.exe
            build/dbpf_tool.exe
          if-no-files-found: error
          retention-days: 14
